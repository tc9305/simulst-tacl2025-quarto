project:
  type: default
  output-dir: ../docs/SimulST
  post-render:
    - python ../scripts/fix_slide_preview.py
  render:
    - index.qmd
lang: zh-TW
format:
  revealjs:
    theme: simple
    css: styles.css
    width: 1280
    height: 720
    margin: 0.06
    center: false
    slide-number: c/t
    transition: fade
    controls: true
    progress: true
    hash: true
    history: true
    navigation-mode: linear
    embed-resources: true
    html-math-method: plain
    include-after-body:
      - assets/demo.html
      - assets/home-button.html
    preview-links: false
    footer: 'SimulST · Papi et al., TACL 2025'
