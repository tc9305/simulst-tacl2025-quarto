<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">Speech buffer 和 text buffer 的歷史裁剪</title><desc id="desc">裁掉較舊語音和對應文字，保留語意對齊的資訊；不是逐 chunk 對 token 的一對一對應。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="15" y="33" font-size="27" fill="#087f8c" text-anchor="start" font-weight="600">裁剪前｜buffer 不斷累積</text><rect x="20" y="63" width="325" height="63" rx="4" fill="#f3e8d9" stroke="#cf8734" stroke-width="2"/><text x="182.5" y="103.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">較舊語音</text><rect x="350" y="63" width="745" height="63" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="722.5" y="103.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">保留的語音歷史</text><rect x="20" y="144" width="325" height="63" rx="4" fill="#f3e8d9" stroke="#cf8734" stroke-width="2"/><text x="182.5" y="184.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">對應的較舊譯文</text><rect x="350" y="144" width="745" height="63" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="722.5" y="184.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">保留的文字歷史</text><text x="20" y="245" font-size="26" fill="#cf8734" text-anchor="start" font-weight="400">trim</text><path d="M125,236 L320,236" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="360" y="245" font-size="27" fill="#087f8c" text-anchor="start" font-weight="400">保留語意對齊的 audio-text context</text><rect x="350" y="278" width="745" height="60" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="722.5" y="317.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Bₛ′ 與 Bₜ′ → 下一輪 Hypothesis Generation</text><text x="15" y="373" font-size="23" fill="#577083" text-anchor="start" font-weight="400">Segment 邊界常 reset；segmentation-free 尤其需要持續管理歷史</text></g></svg>