<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">候選 H 和決策後輸出 E</title><desc id="desc">模型讀取語音与文字 buffer，policy 決定送出全部、一部分，或等待。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><rect x="10" y="35" width="265" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="142.5" y="75.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Bₛ：累積語音</text><rect x="10" y="132" width="265" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="142.5" y="172.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Bₜ：先前已送出文字</text><path d="M290,66 L350,66" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M290,163 L350,163" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="48" width="175" height="130" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="452.5" y="122.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">ST 模型</text><path d="M553,114 L610,114" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="625" y="48" width="215" height="130" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="732.5" y="122.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">候選 H</text><path d="M855,114 L905,114" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="920" y="48" width="225" height="130" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="1032.5" y="122.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Decision policy</text><text x="625" y="219" font-size="24" fill="#577083" text-anchor="start" font-weight="400">H = “will discuss the proposal”</text><text x="625" y="258" font-size="24" fill="#087f8c" text-anchor="start" font-weight="400">例：只送出 E = “will discuss”</text><text x="625" y="299" font-size="24" fill="#577083" text-anchor="start" font-weight="400">其餘等待更多輸入</text><text x="12" y="301" font-size="26" fill="#cf8734" text-anchor="start" font-weight="400">若等待：E = 空</text><text x="12" y="346" font-size="26" fill="#087f8c" text-anchor="start" font-weight="400">若送出：把 E 加入 Bₜ，再呈現給使用者</text></g></svg>