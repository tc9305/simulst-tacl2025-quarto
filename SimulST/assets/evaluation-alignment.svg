<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">長串流輸出與參考句界不同</title><desc id="desc">參考譯文兩句與系統三個輸出片段包含相同文字，但分界不同，句級評分需重對齊。</desc><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="15" y="32" font-size="28" fill="#087f8c">同一段內容，分界不同（非時間尺度）</text><text x="15" y="95" font-size="24" fill="#153447">Reference</text><rect x="220" y="55" width="345" height="65" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="238" y="96.5" font-size="26" fill="#153447">We discuss the plan.</text><rect x="580" y="55" width="550" height="65" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="598" y="96.5" font-size="26" fill="#153447">Then we vote.</text><text x="15" y="194" font-size="24" fill="#153447">System</text><rect x="220" y="154" width="215" height="65" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="238" y="195.5" font-size="26" fill="#153447">We discuss</text><rect x="450" y="154" width="370" height="65" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="468" y="195.5" font-size="26" fill="#153447">the plan. Then we</text><rect x="835" y="154" width="295" height="65" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="853" y="195.5" font-size="26" fill="#153447">vote.</text><path d="M565,128 V145 M580,128 V145" stroke="#cf8734" stroke-width="3" stroke-dasharray="4 3"/><text x="220" y="263" font-size="27" fill="#087f8c">串接文字相同，輸出片段卻不吻合 reference 句界</text><text x="220" y="309" font-size="27" fill="#153447">句級評分 → 重新對齊 → 對齊誤差影響評估</text><text x="220" y="356" font-size="25" fill="#577083">研究方向：可靠的串流評估與 document-level metrics</text></g></svg>
