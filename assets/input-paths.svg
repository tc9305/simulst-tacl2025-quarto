<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">Bounded segments 的兩種來源</title><desc id="desc">A 路從連續語音在線分段；B 路事先拿到預切音檔。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="10" y="34" font-size="28" fill="#087f8c" text-anchor="start" font-weight="600">A｜完整系統：自己處理 continuous stream</text><rect x="20" y="65" width="330" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="185.0" y="110.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Unbounded speech stream</text><path d="M365,101 L430,101" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="445" y="65" width="225" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="557.5" y="110.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">線上 segmentation</text><path d="M685,101 L750,101" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="765" y="65" width="115" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="822.5" y="110.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">S₁</text><rect x="895" y="65" width="115" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="952.5" y="110.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">S₂</text><rect x="1025" y="65" width="115" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="1082.5" y="110.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">S₃</text><text x="790" y="174" font-size="26" fill="#153447" text-anchor="start" font-weight="400">Bounded segments</text><text x="10" y="235" font-size="28" fill="#087f8c" text-anchor="start" font-weight="600">B｜實驗設定：翻譯前已備妥音檔</text><rect x="20" y="266" width="650" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="345.0" y="311.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Gold／automatic pre-segmented input</text><path d="M685,302 L750,302" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="765" y="266" width="375" height="72" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="952.5" y="311.1" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">直接進入翻譯處理</text></g></svg>