<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-labelledby="title"><title id="title">Offline baseline 流程</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="38" font-size="30" fill="#cf8734" font-weight="700">完整輸入 → 完整翻譯</text><rect x="20" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="36" y="125" font-size="26" fill="#087f8c" font-weight="700">sample.m4a</text><text x="36" y="162" font-size="21" fill="#577083" font-weight="400">10.56 秒預錄語音</text><path d="M283,137 L306,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="326" y="125" font-size="26" fill="#087f8c" font-weight="700">音訊前處理</text><text x="326" y="162" font-size="21" fill="#577083" font-weight="400">16 kHz / mono</text><path d="M573,137 L596,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="616" y="125" font-size="26" fill="#087f8c" font-weight="700">SeamlessM4T v2</text><text x="616" y="162" font-size="21" fill="#577083" font-weight="400">S2TT · cmn → eng</text><path d="M863,137 L886,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="906" y="125" font-size="26" fill="#087f8c" font-weight="700">英文翻譯</text><text x="906" y="162" font-size="21" fill="#577083" font-weight="400">完整輸入後輸出</text><text x="20" y="280" font-size="26" fill="#577083" font-weight="400">用途：確認模型、語言與前處理可用，建立比較基準。</text></g></svg>