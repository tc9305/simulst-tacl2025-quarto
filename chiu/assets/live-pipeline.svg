<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-labelledby="title"><title id="title">即時 demo 開發目標</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="38" font-size="30" fill="#cf8734" font-weight="700">下一階段：即時輸入，真實計時</text><rect x="20" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="36" y="125" font-size="26" fill="#087f8c" font-weight="700">Microphone</text><text x="36" y="162" font-size="21" fill="#577083" font-weight="400">320 ms audio frame</text><path d="M283,137 L306,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="326" y="125" font-size="26" fill="#087f8c" font-weight="700">輸入管理</text><text x="326" y="162" font-size="21" fill="#577083" font-weight="400">VAD / endpoint</text><path d="M573,137 L596,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="616" y="125" font-size="26" fill="#087f8c" font-weight="700">Streaming / EMMA</text><text x="616" y="162" font-size="21" fill="#577083" font-weight="400">Incremental English</text><path d="M863,137 L886,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="906" y="125" font-size="26" fill="#087f8c" font-weight="700">字幕 UI</text><text x="906" y="162" font-size="21" fill="#577083" font-weight="400">顯示與時間紀錄</text><text x="20" y="280" font-size="26" fill="#577083" font-weight="400">測試情境：多句連續輸入 · 說話停頓 · 長音訊 · 字幕更新</text><text x="20" y="328" font-size="26" fill="#577083" font-weight="400">量測起點：來源語音實際到來的時間，對照字幕顯示時間</text></g></svg>