<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-labelledby="title"><title id="title">兩種時間軸</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="38" font-size="30" fill="#cf8734" font-weight="700">先辨認時間軸，才解讀 latency</text><text x="20" y="106" font-size="27" fill="#087f8c" font-weight="700">快速餵預錄檔</text><text x="20" y="145" font-size="23" fill="#577083" font-weight="400">程式 wall time</text><path d="M285,115 L740,115" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="780" y="108" font-size="40" fill="#087f8c" font-weight="700">0.54 s</text><text x="780" y="147" font-size="23" fill="#577083" font-weight="400">第一個輸出的程式耗時</text><text x="20" y="228" font-size="27" fill="#087f8c" font-weight="700">依真實時間輸入</text><text x="20" y="267" font-size="23" fill="#577083" font-weight="400">來源音訊時間軸</text><path d="M285,237 L740,237" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="780" y="230" font-size="40" fill="#087f8c" font-weight="700">1.92 s</text><text x="780" y="269" font-size="23" fill="#577083" font-weight="400">第一次 WRITE 的來源位置</text><text x="20" y="332" font-size="26" fill="#153447" font-weight="400">Live latency 還需實測運算、排程與傳輸；兩個數字不可直接相加。</text></g></svg>