<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-labelledby="title"><title id="title">Naive chunk 與 streaming 的差異</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="36" font-size="28" fill="#cf8734" font-weight="700">Naive chunk baseline</text><text x="20" y="205" font-size="28" fill="#087f8c" font-weight="700">Streaming agent</text><rect x="20" y="64" width="100" height="55" rx="3" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="42" y="100" font-size="25" fill="#087f8c" font-weight="700">C1</text><rect x="140" y="64" width="100" height="55" rx="3" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="162" y="100" font-size="25" fill="#087f8c" font-weight="700">C2</text><rect x="260" y="64" width="100" height="55" rx="3" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="282" y="100" font-size="25" fill="#087f8c" font-weight="700">C3</text><rect x="20" y="230" width="100" height="55" rx="3" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="42" y="266" font-size="25" fill="#087f8c" font-weight="700">C1</text><rect x="140" y="230" width="100" height="55" rx="3" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="162" y="266" font-size="25" fill="#087f8c" font-weight="700">C2</text><rect x="260" y="230" width="100" height="55" rx="3" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="282" y="266" font-size="25" fill="#087f8c" font-weight="700">C3</text><path d="M370,92 L430,92" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="50" width="310" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="466" y="93" font-size="26" fill="#087f8c" font-weight="700">逐塊獨立 predict</text><text x="466" y="130" font-size="21" fill="#577083" font-weight="400">每次不沿用前塊狀態</text><path d="M775,104 L840,104" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="865" y="100" font-size="28" fill="#153447" font-weight="700">串接譯文</text><path d="M370,258 L430,258" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="218" width="310" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="466" y="261" font-size="26" fill="#087f8c" font-weight="700">保留跨 chunk 狀態</text><text x="466" y="298" font-size="21" fill="#577083" font-weight="400">累積語音與解碼歷史</text><path d="M775,272 L840,272" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="865" y="260" font-size="28" fill="#087f8c" font-weight="700">READ / WRITE</text><text x="865" y="300" font-size="23" fill="#577083" font-weight="400">由 agent 決定輸出</text></g></svg>