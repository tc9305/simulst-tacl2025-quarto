<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-labelledby="title"><title id="title">Streaming READ 與 WRITE 概念流程</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="38" font-size="30" fill="#cf8734" font-weight="700">新語音到來 → 更新狀態 → 決定輸出</text><rect x="20" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="36" y="125" font-size="26" fill="#087f8c" font-weight="700">中文語音</text><text x="36" y="162" font-size="21" fill="#577083" font-weight="400">320 ms chunk</text><path d="M283,137 L306,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="326" y="125" font-size="26" fill="#087f8c" font-weight="700">特徵與 encoder</text><text x="326" y="162" font-size="21" fill="#577083" font-weight="400">Online features / UnitY</text><path d="M573,137 L596,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="616" y="125" font-size="26" fill="#087f8c" font-weight="700">EMMA decoder</text><text x="616" y="162" font-size="21" fill="#577083" font-weight="400">Monotonic decisions</text><path d="M863,137 L886,137" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="82" width="260" height="110" rx="6" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="906" y="125" font-size="26" fill="#087f8c" font-weight="700">READ / WRITE</text><text x="906" y="162" font-size="21" fill="#577083" font-weight="400">等待或輸出英文</text><path d="M1020,196 L1020,245 L145,245 L145,196" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="280" font-size="26" fill="#087f8c" font-weight="700">READ：等待下一個 chunk，維持狀態</text><path d="M1110,197 L1110,303" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="333" font-size="25" fill="#153447" font-weight="700">WRITE：逐步顯示英文字幕</text></g></svg>