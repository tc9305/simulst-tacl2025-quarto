<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">SimulST 六步概念流程</title><desc id="desc">語音取得、可選分段、buffer 更新、模型和 policy、可選 trimming、顯示輸出。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="50" font-size="36" fill="#cf8734" text-anchor="start" font-weight="700">1</text><text x="68" y="46" font-size="24" fill="#087f8c" text-anchor="start" font-weight="600">Audio acquisition</text><text x="68" y="87" font-size="27" fill="#153447" text-anchor="start" font-weight="400">語音取得</text><path d="M20,114 L345,114" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M346,76 L386,76" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="405" y="50" font-size="36" fill="#cf8734" text-anchor="start" font-weight="700">2</text><text x="453" y="46" font-size="24" fill="#087f8c" text-anchor="start" font-weight="600">Audio segmentation</text><text x="453" y="87" font-size="27" fill="#153447" text-anchor="start" font-weight="400">分段（可選）</text><path d="M405,114 L730,114" stroke="#087f8c" stroke-width="3" fill="none" stroke-dasharray="8 6"/><path d="M731,76 L771,76" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="790" y="50" font-size="36" fill="#cf8734" text-anchor="start" font-weight="700">3</text><text x="838" y="46" font-size="24" fill="#087f8c" text-anchor="start" font-weight="600">Speech buffer update</text><text x="838" y="87" font-size="27" fill="#153447" text-anchor="start" font-weight="400">逐次加入 chunk</text><path d="M790,114 L1115,114" stroke="#087f8c" stroke-width="3" fill="none"/><text x="20" y="240" font-size="36" fill="#cf8734" text-anchor="start" font-weight="700">4</text><text x="68" y="236" font-size="24" fill="#087f8c" text-anchor="start" font-weight="600">Hypothesis generation</text><text x="68" y="277" font-size="27" fill="#153447" text-anchor="start" font-weight="400">模型 + policy</text><path d="M20,304 L345,304" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M346,266 L386,266" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="405" y="240" font-size="36" fill="#cf8734" text-anchor="start" font-weight="700">5</text><text x="453" y="236" font-size="24" fill="#087f8c" text-anchor="start" font-weight="600">Buffers trimming</text><text x="453" y="277" font-size="27" fill="#153447" text-anchor="start" font-weight="400">裁剪歷史（可選）</text><path d="M405,304 L730,304" stroke="#087f8c" stroke-width="3" fill="none" stroke-dasharray="8 6"/><path d="M731,266 L771,266" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="790" y="240" font-size="36" fill="#cf8734" text-anchor="start" font-weight="700">6</text><text x="838" y="236" font-size="24" fill="#087f8c" text-anchor="start" font-weight="600">Output presentation</text><text x="838" y="277" font-size="27" fill="#153447" text-anchor="start" font-weight="400">顯示譯文</text><path d="M790,304 L1115,304" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M1090,150 L1090,185 L45,185 L45,205" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="10" y="373" font-size="24" fill="#577083" text-anchor="start" font-weight="400">持續循環：新語音到來，再更新 buffer、產生候選與呈現輸出</text></g></svg>