<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">110 篇研究的輸入設定</title><desc id="desc">90 篇使用 pre-segmented input；20 篇處理 unbounded input，其中 14 篇 concurrent segmentation，6 篇 segmentation-free。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="35" font-size="28" fill="#153447" text-anchor="start" font-weight="600">預切輸入</text><text x="20" y="180" font-size="28" fill="#153447" text-anchor="start" font-weight="600">Unbounded input</text><rect x="350" y="15" width="600" height="65" fill="#087f8c"/><text x="975" y="60" font-size="28" fill="#087f8c" text-anchor="start" font-weight="400">90 / 110</text><rect x="350" y="160" width="133.33" height="65" fill="#cf8734"/><text x="510" y="204" font-size="28" fill="#cf8734" text-anchor="start" font-weight="400">20 / 110</text><text x="350" y="117" font-size="27" fill="#577083" text-anchor="start" font-weight="400">81.8% 使用 pre-segmented input</text><text x="350" y="267" font-size="27" fill="#577083" text-anchor="start" font-weight="400">14 篇：concurrent segmentation</text><text x="350" y="319" font-size="27" fill="#577083" text-anchor="start" font-weight="400">6 篇：segmentation-free</text><text x="20" y="373" font-size="23" fill="#577083" text-anchor="start" font-weight="400">兩種輸入設定合計 110 篇；分類與範圍以本文 §4 為準</text></g></svg>