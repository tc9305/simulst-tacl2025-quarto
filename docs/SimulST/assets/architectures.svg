<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">Cascade 與 direct 架構</title><desc id="desc">Cascade 串接 ASR 和 MT；direct 在推論時繞過明確的中間 ASR 文字。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="20" y="35" font-size="28" fill="#087f8c" text-anchor="start" font-weight="600">Cascade｜語音 → ASR 文字 → MT 譯文</text><rect x="20" y="66" width="190" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="115.0" y="112.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">語音</text><rect x="285" y="66" width="190" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="380.0" y="112.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">ASR</text><rect x="550" y="66" width="260" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="680.0" y="112.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">明確的中間文字</text><rect x="885" y="66" width="240" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="1005.0" y="112.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">MT → 譯文</text><path d="M225,104 L270,104" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M490,104 L535,104" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M825,104 L870,104" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="20" y="230" font-size="28" fill="#087f8c" text-anchor="start" font-weight="600">Direct｜不經明確的中間 ASR 輸出</text><rect x="20" y="265" width="190" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="115.0" y="311.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">語音</text><path d="M230,303 L385,303" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="400" y="265" width="340" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="570.0" y="311.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">Direct ST 模型</text><path d="M760,303 L880,303" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="895" y="265" width="230" height="75" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="1010.0" y="311.6" font-size="26" fill="#153447" text-anchor="middle" font-weight="400">目標語譯文</text></g></svg>