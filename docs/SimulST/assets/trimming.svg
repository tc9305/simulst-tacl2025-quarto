<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">Policy 與 trimming 的分工</title><desc id="desc">Step 4 決定本次輸出，Step 5 管理下一輪語音與文字歷史；reset 是完全裁剪。</desc><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="15" y="34" font-size="28" fill="#087f8c">Step 4｜現在送出什麼？</text><text x="610" y="34" font-size="28" fill="#087f8c">Step 5｜下一輪保留什麼？</text><text x="15" y="75" font-size="26" fill="#153447">Policy：等待／送出全部或部分 H</text><text x="610" y="75" font-size="26" fill="#153447">Trim：管理 Bₛ 與 Bₜ 的上下文</text><path d="M15,98 H1140" stroke="#d7e0e4" stroke-width="2"/><text x="15" y="146" font-size="26" fill="#153447">Bₛ</text><rect x="90" y="112" width="320" height="52" rx="4" fill="#f3e8d9" stroke="#cf8734" stroke-width="2"/><text x="108" y="147.0" font-size="26" fill="#153447">裁掉較舊語音</text><rect x="425" y="112" width="715" height="52" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="443" y="147.0" font-size="26" fill="#153447">保留的語音歷史</text><text x="15" y="216" font-size="26" fill="#153447">Bₜ</text><rect x="90" y="182" width="320" height="52" rx="4" fill="#f3e8d9" stroke="#cf8734" stroke-width="2"/><text x="108" y="217.0" font-size="26" fill="#153447">裁掉對應的較舊譯文</text><rect x="425" y="182" width="715" height="52" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="443" y="217.0" font-size="26" fill="#153447">保留語意對齊的文字歷史</text><text x="15" y="282" font-size="26" fill="#087f8c">有 segment 邊界：通常 reset，完全清空 buffers</text><text x="15" y="329" font-size="26" fill="#087f8c">持續處理 stream：選擇並保留有用歷史，控制上下文大小</text><text x="15" y="372" font-size="22" fill="#577083">部分 trimming 保留歷史；reset 是完全裁剪。兩者都不會刪除已顯示字幕。</text></g></svg>
