<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc"><title id="title">Segment 與 chunk 的兩種邊界</title><desc id="desc">兩個 3 秒 segments，每段內有 6 個 500 ms chunks；分段和逐步餵入是不同功能。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087f8c"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif"><text x="15" y="32" font-size="28" fill="#087f8c" text-anchor="start" font-weight="600">Segmentation｜決定處理段落的邊界</text><path d="M30,93 L1130,93" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="79" font-size="25" fill="#153447" text-anchor="start" font-weight="400">S₁</text><text x="600" y="79" font-size="25" fill="#153447" text-anchor="start" font-weight="400">S₂</text><path d="M30,60 L30,123" stroke="#cf8734" stroke-width="3" fill="none"/><path d="M580,60 L580,123" stroke="#cf8734" stroke-width="3" fill="none"/><path d="M1130,60 L1130,123" stroke="#cf8734" stroke-width="3" fill="none"/><text x="300" y="150" font-size="23" fill="#577083" text-anchor="middle" font-weight="400">3 秒段落（示例）</text><text x="850" y="150" font-size="23" fill="#577083" text-anchor="middle" font-weight="400">3 秒段落（示例）</text><text x="15" y="216" font-size="28" fill="#087f8c" text-anchor="start" font-weight="600">Chunking｜每次餵入的短音訊</text><rect x="30" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="72.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C1</text><rect x="122" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="164.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C2</text><rect x="214" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="256.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C3</text><rect x="306" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="348.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C4</text><rect x="398" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="440.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C5</text><rect x="490" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="532.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C6</text><rect x="582" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="624.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C7</text><rect x="674" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="716.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C8</text><rect x="766" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="808.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C9</text><rect x="858" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="900.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C10</text><rect x="950" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="992.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C11</text><rect x="1042" y="245" width="84" height="62" rx="4" fill="#e6f0f2" stroke="#087f8c" stroke-width="2"/><text x="1084.0" y="284.05" font-size="23" fill="#153447" text-anchor="middle" font-weight="400">C12</text><text x="30" y="351" font-size="26" fill="#577083" text-anchor="start" font-weight="400">每塊 500 ms（示例）；segmentation-free 也能逐次接收 chunks</text></g></svg>