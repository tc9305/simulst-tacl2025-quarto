<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">LLaMA-Omni 概念資料流</title><desc id="desc">語音經 Whisper encoder 與 adaptor，和文字 embeddings 組成序列輸入 Llama。Hidden states 分別供 LM head 和 speech decoder 使用；生成 token 回饋下個生成步驟，語音 units 經 vocoder 變成波形。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b87"/></marker></defs>
<style>text{font-family:system-ui,"Noto Sans TC",sans-serif;fill:#203047;font-size:18px;text-anchor:middle}rect{fill:#edf4fc;stroke:#9aafc9;stroke-width:1.5;rx:12}.line{fill:none;stroke:#526b87;stroke-width:2;marker-end:url(#a)}.note{font-size:15px;fill:#50627c}.main{fill:#dcedf9}.speech{fill:#eaf5ed}</style>
<rect width="1040" height="800" style="fill:white;stroke:none"/>
<text x="520" y="32" style="font-size:24px;font-weight:600">LLaMA-Omni：從語音輸入到文字與語音回答</text>
<rect x="55" y="60" width="370" height="52"/><text x="240" y="92">語音 → 前處理 → log-Mel 頻譜</text>
<rect x="55" y="137" width="370" height="52"/><text x="240" y="169">Whisper-large-v3 encoder</text>
<rect x="55" y="214" width="370" height="52"/><text x="240" y="246">Speech adaptor：縮短序列、映射維度</text>
<rect x="615" y="137" width="370" height="52"/><text x="800" y="169">文字提示 → Tokenizer</text>
<rect x="615" y="214" width="370" height="52"/><text x="800" y="246">Token embeddings</text>
<path class="line" d="M240 112V137M240 189V214M800 189V214M240 266V302H520V320M800 266V302H520"/>
<rect x="305" y="320" width="430" height="55" class="main"/><text x="520" y="344">在 speech 標記處插入語音表示</text><text x="520" y="366" class="note">組成同一序列，不是逐元素相加</text>
<path class="line" d="M520 375V401"/>
<rect x="305" y="401" width="430" height="52" class="main"/><text x="520" y="433">Llama → 當步 hidden states</text>
<path class="line" d="M420 453V488H250V509M620 453V488H790V509"/>
<rect x="55" y="509" width="390" height="58"/><text x="250" y="534">LM head → logits → 選取下一個 token</text><text x="250" y="556" class="note">token 不一定等於一個字</text>
<rect x="595" y="509" width="390" height="58" class="speech"/><text x="790" y="534">Upsampling → Speech decoder</text><text x="790" y="556" class="note">CTC 預測 → collapse → 離散 units</text>
<path class="line" d="M250 567V602M790 567V602"/>
<rect x="55" y="602" width="390" height="52"/><text x="250" y="634">Tokenizer 解碼 → 文字回答</text>
<rect x="595" y="602" width="390" height="52" class="speech"/><text x="790" y="634">Vocoder → 波形／語音回答</text>
<path class="line" d="M55 539H25V427H305"/><text x="166" y="411" class="note">新 token 經 embedding 回饋下一步</text>
<text x="520" y="708">兩支線以表達同一回答為目標；每次輸出不保證逐字一致。</text>
<text x="520" y="742" class="note">此圖說明概念資料流；不代表已驗證串流音訊輸入或語音翻譯。</text>
<text x="520" y="771" class="note">依官方架構整理 · 2026-10-08</text>
</svg>